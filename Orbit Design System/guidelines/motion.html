<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-page);padding:20px;margin:0}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.k{font:var(--type-eyebrow);color:var(--fg-2)}.v{font:var(--fw-regular) 11px/1.2 var(--font-mono);color:var(--fg-3)}</style></head><body><div style="display:flex;gap:28px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--state-stuck);animation:orbit-pulse 1.8s infinite"></span><div class="v" style="line-height:1.8">--ease-out cubic-bezier(.2,.7,.2,1)<br>--dur-fast 120ms · hover / press<br>--dur-base 180ms · popovers, toasts<br>--dur-slow 280ms · dialogs, panels</div></div></body></html>
