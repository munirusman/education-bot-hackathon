<!-- @dsCard group="Colors" viewport="700x170" name="Session states" subtitle="Working, stuck, needs approval, paused, blocked." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-page);padding:20px;margin:0}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.k{font:var(--type-eyebrow);color:var(--fg-2)}.v{font:var(--fw-regular) 11px/1.2 var(--font-mono);color:var(--fg-3)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--state-working-bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:var(--type-label);color:var(--state-working-ink)"><span style="width:8px;height:8px;border-radius:50%;background:var(--state-working)"></span>Working</div><div class="k">--state-working</div></div><div class="sw"><div class="chip" style="background:var(--state-stuck-bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:var(--type-label);color:var(--state-stuck-ink)"><span style="width:8px;height:8px;border-radius:50%;background:var(--state-stuck)"></span>Stuck</div><div class="k">--state-stuck</div></div><div class="sw"><div class="chip" style="background:var(--state-approval-bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:var(--type-label);color:var(--state-approval-ink)"><span style="width:8px;height:8px;border-radius:50%;background:var(--state-approval)"></span>Needs approval</div><div class="k">--state-approval</div></div><div class="sw"><div class="chip" style="background:var(--state-paused-bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:var(--type-label);color:var(--state-paused-ink)"><span style="width:8px;height:8px;border-radius:50%;background:var(--state-paused)"></span>Paused</div><div class="k">--state-paused</div></div><div class="sw"><div class="chip" style="background:var(--state-danger-bg);display:flex;align-items:center;gap:8px;padding:0 12px;font:var(--type-label);color:var(--state-danger-ink)"><span style="width:8px;height:8px;border-radius:50%;background:var(--state-danger)"></span>Blocked</div><div class="k">--state-danger</div></div></div></body></html>
